[project]
name = "mapa-ztm"
version = "2.0.0"
description = "Mapa pojazdów ZTM Poznań"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "bartekl1"},
]
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli] (>=0.141.1,<0.142.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "gtfs-realtime-bindings (>=2.2.0,<3.0.0)",
    "cachetools (>=7.1.7,<8.0.0)",
    "websockets (>=17.1,<18.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "apscheduler (>=3.11.3,<4.0.0)"
]

[project.urls]
homepage = "https://github.com/bartekl1/mapa-ztm"
source = "https://github.com/bartekl1/mapa-ztm"
changelog = "https://github.com/bartekl1/mapa-ztm/releases"
documentation = "https://github.com/bartekl1/mapa-ztm/blob/main/README.md"
issues = "https://github.com/bartekl1/mapa-ztm/issues"

[tool.poetry]
package-mode = false
