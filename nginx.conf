server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    ssl_certificate /etc/letsencrypt/live/tls-cert/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tls-cert/privkey.pem;

    server_name mapaztm.example.org;

    access_log /var/log/nginx/mapa-ztm/access.log;
    error_log  /var/log/nginx/mapa-ztm/error.log;

    location / {
        proxy_pass http://127.0.0.1:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
    }
}
